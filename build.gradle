buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('compileJava', JavaCompile).configure { compileTask ->
    compileTask.outputs.cacheIf { false }
    compileTask.outputs.upToDateWhen {
        def refMapName = compileTask.extensions.extraProperties.has('refMap')
                ? compileTask.extensions.extraProperties.get('refMap').toString()
                : 'tl_survival_elements.refmap.json'
        new File(compileTask.temporaryDir, refMapName).isFile()
    }
}

tasks.register('verifyMixinRefmap') {
    dependsOn tasks.named('compileJava')
    doLast {
        def compileTask = tasks.named('compileJava').get()
        def refMapName = compileTask.extensions.extraProperties.has('refMap')
                ? compileTask.extensions.extraProperties.get('refMap').toString()
                : 'tl_survival_elements.refmap.json'
        def refMapFile = new File(compileTask.temporaryDir, refMapName)
        if (!refMapFile.isFile()) {
            throw new GradleException("Missing Mixin refmap: ${refMapFile}")
        }
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, 'tl_survival_elements.refmap.json'
    config 'tl_survival_elements.mixins.json'
    defaultObfuscationEnv 'searge'
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf("local:tl_domesticate_more_creatures:${tdmc_version}")
    compileOnly fg.deobf(files('libs/EclipticSeasons-1.80.1-forge-0.18.10-hotfix-8-all.jar'))
}


tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    dependsOn tasks.named('verifyMixinRefmap')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'             : 'tl_survival_elements.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}
